# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo, then paste your MongoDB Atlas connection string for MONGODB_URI.
services:
  - type: web
    name: creditsea-loan-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in the Render dashboard (MongoDB Atlas connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      # Demo mode: no SMS/email provider is configured, so OTPs are returned by the API.
      - key: OTP_DEV_MODE
        value: 'true'
