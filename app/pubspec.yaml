name: creditsea_loan_app
description: "CreditSea loan application (Flutter + GetX)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # State management, routing and dependency injection (+ GetConnect HTTP client).
  get: ^4.7.3
  # Persists the session token on the device.
  get_storage: ^2.1.1
  # Indian currency / date formatting.
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Montserrat (SIL Open Font License, see assets/fonts/OFL.txt), the typeface used in the Figma design.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
